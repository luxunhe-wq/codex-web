name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose --env-file .env.docker.example config --quiet
      - run: docker build -t codex-web-community:test .
      - run: python tests/docker_smoke.py --image codex-web-community:test
      - run: python tests/docker_deploy_smoke.py --image codex-web-community:test
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release.py --staged
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: |
          python tests/browser_workspace.py
          python tests/browser_login_restore.py
          python tests/browser_images.py
          python tests/browser_upload_recovery.py
          python tests/browser_extensions.py
          python tests/browser_files.py
          python tests/browser_projects.py
          python tests/browser_security.py
          python tests/browser_reasoning.py
          python tests/browser_navigation.py
          python tests/browser_language.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-screenshots
          path: artifacts/
